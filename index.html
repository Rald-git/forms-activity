<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ganacias - HTML Form Activity</title>
</head>

<body>

    <h1>HTML Form</h1>

    <form action="#" method="post">

        <fieldset>
            <legend>Personal Information</legend>

            <p>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </p>

        </fieldset>

        <br>

        <fieldset>
            <legend>Gender</legend>

            <p>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
                <br>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
                <br>

                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
            </p>

        </fieldset>

        <br>

        <fieldset>
            <legend>Tournament and Hobbies</legend>

            <p>
                <input type="checkbox" id="gaming" name="hobbies" value="Mobile Gaming">
                <label for="Mobile Gaming">Game Tournament </label>
                <br>

                <input type="checkbox" id="Game Scrimmage" name="hobbies" value="Game Scrimmage">
                <label for="Scrimmage">Scrimmage</label>
                <br>

                <input type="checkbox" id="Basketball" name="hobbies" value=" asketball">
                <label for="Playing basketball">Playing basketball</label>
            </p>

        </fieldset>

        <br>

        <p>
            <label for="comments">Additional Comments:</label>
            <br>
            <textarea id="comments" name="comments" rows="5" cols="40"></textarea>
        </p>

        <p>
            <button type="submit">Submit</button>
        </p>

    </form>

</body>

</html>
